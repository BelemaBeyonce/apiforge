[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "apiforge"
version = "0.2.0"
description = "Python Backend & AI Evaluation Lab"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.163,<0.164", "starlette>=1.3.1,<2", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "psycopg[binary]>=3,<4", "PyJWT>=2.10,<3", "argon2-cffi>=25,<26", "email-validator>=2,<3", "limits>=5,<6", "regex>=2025,<2027", "httpx>=0.28,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pip-audit>=2,<3", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
