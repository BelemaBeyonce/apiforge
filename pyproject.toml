[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "apiforge"
version = "0.1.0"
description = "Python Backend & AI Evaluation Lab"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.116", "uvicorn>=0.30,<1", "pydantic-settings>=2,<3", "sqlalchemy>=2,<3", "alembic>=1.14,<2", "psycopg[binary]>=3,<4"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pytest-cov>=6,<8", "ruff>=0.11,<1"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
