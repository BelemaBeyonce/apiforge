name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: apiforge
          POSTGRES_DB: apiforge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U apiforge"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90
      - name: PostgreSQL migration and API integration
        env:
          DATABASE_URL: postgresql+psycopg://apiforge@localhost:5432/apiforge
        run: |
          alembic upgrade head
          alembic check
          python -m examples.seed
          python -m examples.demo --in-process
          alembic downgrade base
          alembic upgrade head
      - run: docker build -t apiforge:ci .
